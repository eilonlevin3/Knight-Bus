# Builds BOTH versions and publishes them together to GitHub Pages:
#   main branch  -> https://<user>.github.io/Knight-Bus/        (what users get)
#   debug branch -> https://<user>.github.io/Knight-Bus/debug/  (test it on your phone first)
# Runs on every push to main or debug, every night (fresh timetables), and by hand.
# A broken debug build never stops the main site from deploying.
# Docs: docs/release-process.md, docs/data-pipeline.md
# @req REQ-REL-1 @req REQ-REL-3 @req REQ-DATA-2
name: Build data and deploy

on:
  push:
    branches: [main, debug]
  schedule:
    - cron: '30 1 * * *' # 04:30 Israel time (summer), after the ministry publishes the new GTFS
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Is there a debug branch?
        id: debug
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" debug >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out debug
        if: steps.debug.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: debug
          path: debug

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # One small summary per day of how long buses took between stops, for the last 30 days
      # (pipeline/build-speeds.mjs, REQ-DATA-12). Each run adds the days that are missing and
      # saves the folder again; if it is ever lost, the days are read again from the archive.
      - name: Restore the daily travel-time summaries
        uses: actions/cache@v4
        with:
          path: speed-days
          key: speed-days-${{ github.run_id }}
          restore-keys: speed-days-

      - name: Build main site
        run: bash main/scripts/build-site.sh main _site
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          SPEED_DAYS_DIR: ${{ github.workspace }}/speed-days
          # A push should publish soon: read few new days. The nightly and by-hand runs read more.
          SPEED_MAX_NEW_DAYS: ${{ github.event_name == 'push' && 2 || 10 }}

      - name: Build debug site (allowed to fail)
        id: debugbuild
        if: steps.debug.outputs.exists == 'true'
        continue-on-error: true
        run: bash debug/scripts/build-site.sh debug _site/debug
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GTFS_ZIP: ${{ github.workspace }}/main/.cache/gtfs.zip # reuse main's download
          SPEED_DAYS_DIR: ${{ github.workspace }}/speed-days
          # A push should publish soon: read few new days. The nightly and by-hand runs read more.
          SPEED_MAX_NEW_DAYS: ${{ github.event_name == 'push' && 2 || 10 }}

      - name: Summary
        run: |
          touch _site/.nojekyll
          {
            echo "### Published"
            echo "- main: \`$(git -C main rev-parse --short HEAD)\` → /"
            if [ "${{ steps.debug.outputs.exists }}" = "true" ]; then
              if [ "${{ steps.debugbuild.outcome }}" = "success" ]; then
                echo "- debug: \`$(git -C debug rev-parse --short HEAD)\` → /debug/"
              else
                echo "- ⚠️ debug build FAILED: /debug/ is not published this time. Open the 'Build debug site' step for the error."
              fi
            fi
            echo; echo '```'; du -sh _site/data/cities/* _site/debug/data/cities/* 2>/dev/null || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
